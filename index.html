<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>서현이 영어 비밀 연구소</title><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>서현이 영어 비밀 연구소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered column like a camp notebook; huge tap targets for a tablet held by a 2nd grader. Single bright look by choice. */
:root{
  --bg:#F6F1FC; --card:#FFFFFF; --ink:#3B2E55; --muted:#7E7299; --line:#E6DCF4;
  --pine:#8E6FD0; --pine-soft:#EEE6FB; --maple:#E06A92; --maple-soft:#FDE6EE;
  --sun:#FFCF6B; --sun-soft:#FFF4D8; --lake:#6F9BE0; --lake-soft:#E4EDFC;
  --he:#2F6FB3; --he-soft:#DCE9F7; --she:#C2457A; --she-soft:#F8DDE8;
  --f-disp:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-en:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--lake);outline-offset:3px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-size:24px;color:var(--pine);display:flex;align-items:center;gap:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:4px 0}
.chips{display:flex;gap:8px;align-items:center}
.chip{font-family:var(--f-disp);font-size:20px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;display:flex;gap:6px;align-items:center}
.mission{background:linear-gradient(135deg,#A98BE6 0%,#C99BE3 55%,#F2A9C9 100%);color:#fff;border-radius:28px;padding:28px 28px 24px;display:grid;gap:14px;position:relative;overflow:hidden}
.mission::after{content:"";position:absolute;right:-30px;bottom:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.12) 0 60%,transparent 61%)}
.mission h2{font-size:32px}
.mission .sub{font-size:18px;opacity:.9}
.mrow{display:flex;gap:10px;flex-wrap:wrap}
.mpill{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 14px;font-family:var(--f-disp);font-size:19px}
.go{justify-self:start;background:var(--sun);color:var(--ink);font-family:var(--f-disp);font-size:28px;padding:14px 34px;border-radius:20px;box-shadow:0 5px 0 #D9A63E;position:relative;z-index:1}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #D9A63E}
.done-msg{font-family:var(--f-disp);font-size:22px}
.section-t{font-family:var(--f-disp);font-size:22px;color:var(--pine);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.section-t small{font-family:var(--f-body);font-size:15px;color:var(--muted)}
.board{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.slot{aspect-ratio:1;border-radius:18px;background:var(--bg);display:grid;place-items:center;font-size:38px;max-width:100%}
.slot.empty{border:2px dashed var(--line);background:transparent;font-size:16px;color:var(--line)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;font-size:14px;color:var(--muted)}
.wd b{display:block;font-size:24px;line-height:1.3}
.wd.on{border-color:var(--maple);background:var(--maple-soft);color:var(--maple)}
.wd.today{outline:3px solid var(--sun);outline-offset:1px}
.lesson{display:flex;flex-direction:column;gap:16px}
.lbar{display:flex;align-items:center;gap:12px}
.x{font-size:28px;color:var(--muted);width:48px;height:48px;border-radius:14px}
.prog{flex:1;height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.pnum{font-family:var(--f-en);font-weight:600;font-size:20px;color:var(--muted);min-width:76px;text-align:right}
.prog i{display:block;height:100%;background:var(--pine);border-radius:999px;transition:width .3s}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:36px}
.step{font-family:var(--f-disp);font-size:17px;padding:6px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);color:var(--muted)}
.step.cur{background:var(--lake);border-color:var(--lake);color:#fff}
.step.ok{background:var(--pine-soft);border-color:var(--pine-soft);color:var(--pine)}
.card{background:var(--card);border:2px solid var(--line);border-radius:30px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-height:420px;justify-content:center}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{font-family:var(--f-disp);font-size:15px;padding:3px 12px;border-radius:999px;background:var(--sun-soft);color:#8A5A00}
.tag.phone{background:#E8DDF7;color:#6B4FA0}
.tag.rev{background:var(--lake-soft);color:var(--lake)}
.tag.bonus{background:var(--maple-soft);color:var(--maple)}
.tag.talk{background:var(--pine-soft);color:var(--pine)}
.pic{display:flex;align-items:flex-end;gap:6px;font-size:88px;line-height:1}
.who{font-size:44px;border-radius:20px;padding:6px 10px;align-self:center}
.who.he{background:var(--he-soft)} .who.she{background:var(--she-soft)} .who.n{background:var(--bg)}
.en{font-family:var(--f-en);font-weight:600;font-size:clamp(34px,6.5vw,54px);line-height:1.15;letter-spacing:.01em;text-wrap:balance}
.ko{font-size:22px;color:var(--muted)}
.again{font-family:var(--f-disp);font-size:24px;color:var(--maple)}
.qline{font-family:var(--f-en);font-weight:700;font-size:clamp(40px,7vw,60px);line-height:1.15;color:var(--ink)}
.ask{font-family:var(--f-disp);font-size:clamp(24px,4vw,32px);line-height:1.4;color:var(--ink);background:var(--sun-soft);border-radius:18px;padding:12px 20px}
.mission .plan{font-size:17px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;line-height:1.6}
.backbtn{font-size:26px;color:var(--muted);width:48px;height:48px;border-radius:14px}
.ko.big{font-family:var(--f-disp);font-size:clamp(28px,5vw,40px);color:var(--ink)}
.hint{font-family:var(--f-disp);font-size:22px;color:var(--pine)}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.big{font-family:var(--f-disp);font-size:24px;border-radius:22px;padding:16px 28px;display:flex;align-items:center;gap:10px;min-height:68px}
.play{background:var(--lake);color:#fff;box-shadow:0 5px 0 #4F78BC}
.soft{background:var(--lake-soft);color:var(--lake)}
.next{background:var(--pine);color:#fff;box-shadow:0 5px 0 #6A4FB0}
.said{background:var(--maple);color:#fff;box-shadow:0 5px 0 #B84870}
.big:active{transform:translateY(4px);box-shadow:none}
.big[disabled]{opacity:.35;pointer-events:none}
.mic{width:150px;height:150px;border-radius:50%;padding:0;display:grid;place-items:center;filter:drop-shadow(0 6px 0 #D9B8EC)}
.mic svg{width:100%;height:100%;display:block}
.mic .ear{transform-box:fill-box;transform-origin:50% 10%}
.mic.on .ear{animation:wig .45s ease-in-out infinite alternate}
.mic.on .ear.r{animation-delay:.15s}
.mic.on{animation:bob 1s ease-in-out infinite}
@keyframes wig{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.timer{width:100%;max-width:520px;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;width:0;background:var(--sun);border-radius:999px}
.timer.late i{background:var(--maple)}
.clock{font-family:var(--f-en);font-weight:600;font-size:18px;color:var(--muted);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 12px;white-space:nowrap}
.timeout{font-family:var(--f-en);font-weight:700;font-size:44px;color:var(--maple)}
.wtable{width:100%;border-collapse:collapse;font-size:16px}
.wtable td,.wtable th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;font-variant-numeric:tabular-nums}
.wtable td:first-child,.wtable th:first-child{text-align:left}
.wtable th{color:var(--muted);font-weight:400}
.wtable tr.cur td{background:var(--sun-soft)}
.ring{width:110px;height:110px;border-radius:50%;background:var(--lake);color:#fff;font-size:50px;display:grid;place-items:center;box-shadow:0 6px 0 #4F78BC}
@keyframes pulse{0%{box-shadow:0 7px 0 #B84870,0 0 0 0 rgba(212,71,42,.45)}100%{box-shadow:0 7px 0 #B84870,0 0 0 28px rgba(212,71,42,0)}}
.typein{display:flex;gap:10px;width:100%;max-width:620px}
.typein input{flex:1;min-width:0;font-family:var(--f-en);font-size:26px;padding:12px 16px;border:3px solid var(--lake);border-radius:18px;background:var(--card);color:var(--ink)}
.linkbtn{font-size:15px;color:var(--muted);text-decoration:underline}
.heard{font-size:22px;color:var(--muted);min-height:40px}
.heard b{font-family:var(--f-en);font-weight:600;font-size:32px;color:var(--ink)}
.answer{min-height:78px;width:100%;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding-bottom:10px}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{font-family:var(--f-en);font-weight:600;font-size:30px;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;border-radius:18px;padding:8px 20px;min-height:64px;min-width:56px}
.tile.used{visibility:hidden}
.answer .tile{border-color:var(--lake);color:var(--lake)}
.combo{position:absolute;top:-22px;right:14px;background:linear-gradient(135deg,#FF7EB3,#A77BF3);color:#fff;font-family:var(--f-disp);font-size:26px;padding:6px 16px;border-radius:999px;box-shadow:0 6px 16px rgba(167,123,243,.4);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;z-index:5}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.card{position:relative}
.hintans{font-family:var(--f-disp);font-size:30px;color:var(--ink);background:#F3ECFF;border-radius:18px;padding:10px 18px;margin-top:6px;text-align:center}
.kobtn{border:0;background:none;color:var(--muted);font-size:15px;text-decoration:underline;padding:2px 0;cursor:pointer}
.pickstk{display:flex;gap:16px;justify-content:center;margin:10px 0}
.pickstk button{font-size:64px;width:110px;height:110px;border-radius:28px;border:3px solid #E6DAFA;background:#fff;cursor:pointer}
.pickstk button.on{border-color:#A77BF3;background:#F3ECFF;transform:scale(1.08)}
.big.skip{background:var(--lake);color:#fff}
.hintans.frame{letter-spacing:1px;color:#6B4FA0}
.when{font-family:var(--f-disp);font-size:26px;padding:6px 18px;border-radius:999px;margin-bottom:4px}
.when.w-past{background:#FFE3EE;color:#C2457A}
.when.w-now{background:#E3F4EA;color:#2E8B57}
.feedback{width:100%;border-radius:22px;padding:16px;font-family:var(--f-disp);font-size:24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.feedback.good{background:var(--pine-soft);color:var(--pine)}
.feedback.bad{background:var(--maple-soft);color:var(--maple)}
.feedback .en{font-size:32px;color:var(--ink)}
.feedback small{font-family:var(--f-body);font-size:18px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px}
.opt{font-family:var(--f-en);font-weight:600;font-size:26px;background:var(--card);border:3px solid var(--line);border-bottom-width:6px;border-radius:18px;padding:14px 18px;text-align:left}
.opt.right{border-color:var(--pine);background:var(--pine-soft)}
.opt.wrong{border-color:var(--maple);background:var(--maple-soft)}
.bubble{border-radius:22px;padding:14px 18px;max-width:90%;text-align:left}
.bubble .en{font-size:30px}
.bubble .ko{font-size:17px}
.bubble.a{background:var(--lake-soft);align-self:flex-start}
.bubble.b{background:var(--sun-soft);align-self:flex-end}
.chat{display:flex;flex-direction:column;gap:12px;width:100%}
.thumb{font-family:var(--f-disp);font-size:56px}
.tip{background:var(--sun-soft);border-color:var(--sun)}
.tip h2{font-size:30px;color:#7A4E00}
.tip .rule{font-family:var(--f-disp);font-size:24px;line-height:1.5}
.tip .ex{display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px}
.tip .exrow{background:var(--card);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left}
.tip .exrow .en{font-size:26px}
.tip .exrow span.e{font-size:36px}
.swap{display:inline-block;background:var(--maple);color:#fff;border-radius:10px;padding:0 8px}
.scene{display:flex;align-items:center;gap:8px;font-size:72px;line-height:1}
.scene .dots{font-size:28px;color:var(--muted);letter-spacing:6px}
.finish{background:var(--card);border:2px solid var(--line);border-radius:30px;padding:34px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.finish .bigsticker{font-size:120px;line-height:1;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}100%{transform:scale(1)}}
.finish h2{font-size:34px;color:var(--pine)}
.parent{display:flex;flex-direction:column;gap:18px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ptop h2{font-size:26px}
.back{font-family:var(--f-disp);font-size:18px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.stat .lab{font-size:14px;color:var(--muted);letter-spacing:.02em}
.stat .num{font-family:var(--f-disp);font-size:38px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .num small{font-size:18px;color:var(--muted)}
.stat.dday{background:var(--maple);border-color:var(--maple);color:#fff}
.stat.dday .lab{color:#fff;opacity:.85}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:20px;color:var(--pine)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:440px}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:13px;color:var(--muted);max-width:100%}
.cal div.on{background:var(--pine);color:#fff}
.cal div.today{outline:2px solid var(--sun)}
.cal .dow{background:none;aspect-ratio:auto;font-size:12px}
.bar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-family:var(--f-en);font-weight:500;font-size:20px;min-width:0}
.row .t small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted)}
.pill{font-size:13px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.p-know{background:var(--pine-soft);color:var(--pine)}
.p-weak{background:var(--maple-soft);color:var(--maple)}
.p-learn{background:var(--sun-soft);color:#8A5A00}
.p-new{background:var(--bg);color:var(--muted)}
.mini{width:44px;height:44px;border-radius:12px;background:var(--lake-soft);color:var(--lake);font-size:18px}
.note{color:var(--muted);font-size:15px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{font-size:15px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 14px}
.tbtn.warn{color:var(--maple);border-color:var(--maple-soft)}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.field input,.field select{font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.gate{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.gate .q{font-family:var(--f-disp);font-size:24px}
.dots4{display:flex;gap:14px}
.dots4 i{width:20px;height:20px;border-radius:50%;border:3px solid var(--pine)}
.dots4 i.f{background:var(--pine)}
.keys{display:grid;grid-template-columns:repeat(3,68px);gap:10px}
.keys button{height:64px;border-radius:16px;background:var(--bg);font-family:var(--f-disp);font-size:26px}
.err{color:var(--maple);min-height:24px}
details summary{cursor:pointer;color:var(--pine);font-family:var(--f-disp);font-size:18px}
@media (max-width:520px){.mission h2{font-size:26px}.pic{font-size:70px}.row{grid-template-columns:auto 1fr auto}.row .pill{display:none}.tile{font-size:24px;padding:6px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card [data-act="next"]{display:none!important}
.mission.done{text-align:center;justify-items:center}
.mission .spark{font-size:30px;letter-spacing:6px;animation:twinkle 1.4s ease-in-out infinite alternate}
.donerow{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.donestk{font-size:72px;line-height:1;background:rgba(255,255,255,.25);border-radius:24px;padding:8px 14px;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.done-msg{text-align:left}
@keyframes twinkle{from{opacity:.55;transform:scale(.95)}to{opacity:1;transform:scale(1.06)}}
.finish{background:linear-gradient(180deg,#FFFFFF 0%,#F7EEFF 100%)}
.finish .crown{font-size:44px;letter-spacing:8px;animation:twinkle 1s ease-in-out infinite alternate}
.finish .bigsticker{font-size:150px;animation:pop .8s cubic-bezier(.3,1.6,.5,1),wiggle 1.6s ease-in-out .8s infinite}
.finish h2{font-size:42px;color:var(--pine)}
.finish .cheer{font-family:var(--f-disp);font-size:26px;color:var(--maple)}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-24px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

<div class="wrap" id="app"></div>

<script>
const PACK_DB="cheonilmun-pack";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(PACK_DB,1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise(res=>{ const t=db.transaction("kv").objectStore("kv").get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>res(null); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }

function listenOnce(onStart){

const EXP=[[/\bi'm\b/g,"i am"],[/\byou're\b/g,"you are"],[/\bhe's\b/g,"he is"],[/\bshe's\b/g,"she is"],[/\bthat's\b/g,"that is"],[/\bit's\b/g,"it is"],[/\bthere's\b/g,"there is"],[/\bisn't\b/g,"is not"],[/\baren't\b/g,"are not"],[/\bdon't\b/g,"do not"],[/\bdoesn't\b/g,"does not"],[/\blet's\b/g,"let us"],[/\bim\b/g,"i am"],[/\b(see|sea|shi|shee)\b/g,"she"],[/\b(hi|hee)\b/g,"he"],[/\bhis\b/g,"he is"],[/\bshes\b/g,"she is"],[/\bhes\b/g,"he is"],[/\bokay\b|\bok\b/g,"okay"]];
function toks(s){ s=" "+s.toLowerCase().replace(/[’]/g,"'")+" "; s=s.replace(/[^a-z' ]/g," "); for(const [a,b] of EXP) s=s.replace(a,b); return s.replace(/\s+/g," ").trim().split(" ").filter(Boolean); }
function lcs(a,b){ const d=Array(b.length+1).fill(0); for(const x of a){ let prev=0; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]= x===b[j-1]? prev+1 : Math.max(d[j],d[j-1]); prev=t; } } return d[b.length]; }
const KEY=new Set(["i","you","he","she","this","that","it","there","we","they"]);
const NEG=new Set(["not","no"]);
const QSTART=new Set(["is","are","am","do","does","can","where","who","how","what"]);
const PRON_FILL=new Set(["hey","hee","hi","a","the","e","uh","ah","eh","it","her","his","see","sea","shi","shee","c","g"]);
// A child's "he"/"she" is often heard as hey, a, the... or dropped. Only the OTHER pronoun counts as wrong.
function fixPron(T,H){
  if(T.includes("he")||T.includes("she")) H=H.join(" ").replace(/\beasy\b/g,"is he").replace(/\bissue\b/g,"is she").replace(/\bdizzy\b/g,"does he").split(" ").filter(Boolean);
  for(const [p,o] of [["he","she"],["she","he"]]){
    if(!T.includes(p)||H.includes(p)||H.includes(o)) continue;
    H=[...H]; const j=H.findIndex(w=>PRON_FILL.has(w)&&!T.includes(w));
    if(j>=0) H[j]=p; else H.splice(Math.min(T.indexOf(p),H.length),0,p);
  }
  for(const p of ["he","she"]){ const ti=T.indexOf(p), hi=H.indexOf(p); // "he's" heard as "hey" swallows the "is"
    if(ti>=0&&hi>=0&&T[ti+1]==="is"&&H[hi+1]!=="is"&&H[hi-1]!=="is") H=[...H.slice(0,hi+1),"is",...H.slice(hi+1)]; }
  return H;
}
function matches(target,alts,allowIt){
  let T=toks(target);
  for(const alt of alts){
    let H=fixPron(T,toks(alt));
    if(allowIt) H=H.map(w=>w==="it"&&T.includes("that")?"that":w);
    const tol = T.length>=5?1:0;
    if(lcs(T,H) < T.length-tol) continue;
    if([...T].some(w=>KEY.has(w)&&!H.includes(w))) continue;
    if(T.some(w=>NEG.has(w)) !== H.some(w=>NEG.has(w))) continue;
    if(T.includes("not") !== H.includes("not")) continue;
    if(QSTART.has(T[0]) && H[0]!==T[0]) continue;
    return true;
  }
  return false;
}

function conceptsOf(it){
  const c=[]; const t=it.text.toLowerCase();
  if(it.who===HE||it.who===SHE||/^(he|she)\b/.test(t)) c.push("hs");
  if(/^(is|are|am)\b/.test(t)) c.push("q");
  if(it.q) c.push("ans");
  if(it.week===5) c.push("this");
  if(it.week===6) c.push("that");
  if(/^(do|does)\b/.test(t)) c.push("do");
  return c;
}

function weekRange(w){ const b=ITEMS.filter(i=>i.src==="book"&&i.week===w&&i.day); if(!b.length) return ""; const lo=Math.min(...b.map(i=>i.day)), d0=b.find(i=>i.day===lo).date;
  const m=d0.match(/(\d+)월 (\d+)일/); let end=""; if(m){ const dt=new Date(2026,+m[1]-1,+m[2]+6); end=`${dt.getMonth()+1}월 ${dt.getDate()}일`; }
  return `책 Day ${lo} ~ Day ${lo+6} (${d0} ~ ${end})`; }
function buildQueue(wArg){
  const w=wArg||curWeek(), q=[];
  const ph=wArg?[]:phoneCards(); q.push(...ph);
  const book=ITEMS.filter(i=>i.src==="book"&&i.week===w);
  const pass=(S.weekPass||{})[w]||0;
  // group book sentences by word (He is shy / She is shy = one topic); ~3 items per topic, he/she only once per topic
  const topicKey=t=>t.toLowerCase().replace(/[.?!]/g,"").replace(/^(i am|i'm|you are|you're|he is|he's|she is|she's|this is|that is|that's|there is|i have|are you|is he|is she|am i|is this|is that|is there|do you have)\s+(not\s+)?/,"").trim();
  const topics=[]; const tmap={};
  book.forEach(it=>{ const k=topicKey(it.text); if(!tmap[k]){ tmap[k]=[]; topics.push(tmap[k]); } tmap[k].push(it); });
  const HS=/\b(he|she)\b/i;
  topics.forEach((tb,k)=>{
    tb.forEach(it=>q.push({type:"say",id:it.id,fresh:true}));
    const bookTexts=new Set(tb.map(i=>i.text)), bookHS=tb.some(i=>HS.test(i.text));
    const D=ITEMS.filter(d=>d.src==="drill"&&tb.some(t=>t.id===d.base)&&!bookTexts.has(d.text));
    const X=D.filter(d=>/x\d+$/.test(d.id)), N=D.filter(d=>!/x\d+$/.test(d.id)&&!(bookHS&&HS.test(d.text)));
    const want=Math.max(1,3-tb.length), pick=[]; let hs=false;
    for(let j=0;j<N.length&&pick.length<want;j++){ const d=N[(k+pass*2+j)%N.length]; if(HS.test(d.text)){ if(hs) continue; hs=true; } if(!pick.some(p=>p.text===d.text)) pick.push(d); }
    if(X.length) pick.push(X[(k+pass)%X.length]);
    pick.forEach(d=>q.push({type:"say",id:d.id,fresh:true}));
  });
  const hsPool=ITEMS.filter(i=>i.week===w&&(i.who===HE||i.who===SHE)&&/^(he|she|is he|is she|does he|does she)\b/i.test(i.text));
  shuffle(hsPool).slice(0,S.whoCount??3).forEach(x=>q.push({type:"pick",kind:"hs",id:x.id}));
  if(w===5){ const tt=ITEMS.filter(i=>i.week===5&&!i.q&&/^(This|That) is/.test(i.text)); if(tt.length) q.push({type:"pick",kind:"tt",id:pickOne(tt).id}); }
  const weak=wArg?[]:ITEMS.filter(i=>i.week!==w&&S.items[i.id]&&S.items[i.id].recentWrong>0).slice(0,ph.length?Math.max(2,S.reviewCap-2):S.reviewCap);
  weak.forEach(it=>q.push({type:"say",id:it.id,fresh:false}));
  TALKS.filter(t=>t.week===w).forEach(t=>q.push({type:"talk",id:t.id}));
  return q;
}

function elapsed(){ return L? L.base+(Date.now()-L.tStart) : 0; }
function mmss(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function saveSession(){ S.session={date:todayStr(),week:curWeek(),i:L.i,elapsed:elapsed(),queue:L.queue.map(c=>({type:c.type,id:c.id,kind:c.kind,fresh:c.fresh}))}; save(); }
function startLesson(){

  if(!S.daySnap||S.daySnap.date!==todayStr()) S.daySnap={date:todayStr(),items:JSON.parse(JSON.stringify(S.items)),talks:JSON.parse(JSON.stringify(S.talks)),weekPass:JSON.parse(JSON.stringify(S.weekPass||{})),nextWeek:S.nextWeek};
  const queue=resume?ss.queue:buildQueue();
  if(resume&&!queue.some(c=>(byId[c.id]&&byId[c.id].src==="phone")||(c.type==="talk"&&talkById[c.id]&&talkById[c.id].src==="phone"))) queue.splice(ss.i,0,...phoneCards()); // mission started before the phone corner existed

function cur(){ return L.queue[L.i]; }
function enterCard(){
  const c=cur(); c.st={step:0,tries:0,heard:"",fb:null,firstTry:true,picked:[]};
  if(c.type==="say"){
    const it=byId[c.id];
    c.steps = ["speak"];
    c.st.step=0; prepOrder(c,it);
    if(it.q){ c.st.yes=Math.random()<.6; }
  }
  if(c.type==="talk"){
    const t=talkById[c.id], s=S.talks[c.id];
    c.mode = !s||s.box<2 ? "choose" : (s.box<4 ? "sayB" : "sayA");
    if(c.mode==="choose"){
      const others=shuffle((t.src==="phone"?PTALKS:TALKS).filter(x=>x.id!==t.id&&(t.src==="phone"||x.week<=Math.max(S.bookWeek,2))).map(x=>x.lines[1].text).filter(x=>x!==t.lines[1].text));
      c.opts=shuffle([t.lines[1].text,...[...new Set(others)].slice(0,2)]);
    }
  }
  if(c.type==="pick"&&c.kind==="tense"){ const z=TZ[c.id]; c.right=z.right; c.opts=shuffle([z.right,z.wrong]); return; }
  if(c.type==="pick"){
    const it=byId[c.id];
    if(c.kind==="hs"){
      const boy=Math.random()<.5; c.boy=boy; const P=boy?pickOne([["👨","아빠","아빠는"],["👦","도현 (남동생)","도현이는"],["🧒","로한 (오빠)","로한이는"],["👴","할아버지","할아버지는"]]):pickOne([["👩","엄마","엄마는"],["👧","예은 (여동생)","예은이는"],["👱‍♀️","시온 (언니)","시온이는"],["👵","할머니","할머니는"]]);
      const pron=boy?"He":"She";
      const isQ=/^(Is|Does) (he|she)\b/.test(it.text);
      const rest=isQ? it.text.replace(/^(Is|Does) (he|she)\b/,(m,v)=>v+" #") : it.text.replace(/^(He|She)('s| is| has| doesn't)/,(m,p,v)=>"#"+v);
      const mk=p=>rest.replace("#",isQ?p.toLowerCase():p);
      c.person=P; c.right=mk(pron); c.opts=shuffle([mk("He"),mk("She")]);
      c.ko=P[2]+" "+it.ko.replace(/^(그는|그녀는)\s*/,"");
    } else {
      const near=Math.random()<.5; c.near=near;
      const core=it.text.replace(/^(This|That) is (not )?/,"").replace(/\.$/,"");
      const neg=/ not /.test(it.text)?"not ":"";
      c.right=(near?"This":"That")+` is ${neg}${core}.`; c.opts=shuffle([`This is ${neg}${core}.`,`That is ${neg}${core}.`]);
      c.obj=it.emoji;
    }
  }
}
function splitTiles(text){ const m=text.match(/^(.*?)([.?!])$/); const body=m?m[1]:text, p=m?m[2]:"."; return {words:body.split(" "), punct:p==="!"?".":p}; }
function prepOrder(c,it){
  const {words,punct}=splitTiles(it.text);
  const lw=words.map(w=>w.toLowerCase());
  const ds=[];
  const swap={he:"She",she:"He","he's":"She's","she's":"He's",this:"That",that:"This",is:"are",are:"is",am:"are",do:"does",does:"do",have:"has",has:"have"};
  for(const w of lw){ if(swap[w]){ let s=swap[w]; const orig=words[lw.indexOf(w)]; if(orig[0]===orig[0].toUpperCase()) s=s[0].toUpperCase()+s.slice(1); else s=s.toLowerCase(); ds.push(s); } }
  if(!lw.includes("not")&&!lw.includes("isn't")&&!lw.includes("don't")) ds.push("not");
  const extra=shuffle([...new Set(ds)].filter(d=>!words.includes(d))).slice(0,2);
  c.target=[...words,punct];
  c.pool=shuffle([...words,...extra,".","?"].map((w,k)=>({w,k})));
}

function sayBody(c){

    const pool=c.pool.map((p,k)=>`<button class="tile ${c.st.picked.includes(k)?"used":""}" data-p="${k}">${h(p.w)}</button>`).join("");
    let fb="";
    if(c.st.fb==="good") fb=`<div class="feedback good">정답! 💖<div class="en">${h(it.text)}</div><button class="big next" data-act="next">계속 →</button></div>`;
    if(c.st.fb==="bad") fb=`<div class="feedback bad">${c.st.why||"앗, 다시 볼까요?"}<div class="en">${h(it.text)}</div><div class="btns"><button class="big play" data-act="play">🔊 듣기</button><button class="big next" data-act="next">알겠어요 →</button></div></div>`;

    if(c.st.fb==="giveup") return `${head}<div class="feedback bad">이렇게 대답해요<div class="en">${h(ans)}</div>${full?`<div class="ko">또는: ${h(full)}</div>`:""}<button class="big next" data-act="next">알겠어요 →</button></div>`;
    const body0=head;
    if(false){

      const opts=c.opts||(c.opts=shuffle([...new Set([ans,wrongP,wrongY])]));

  }
}
// hint = the sentence frame: first words kept, the rest as first letters ("My mom g___ me a p______.")
function frameOf(t){ const w=t.split(" "), keep=w.length<=3?1:2; return w.map((x,k)=>k<keep?x:x.replace(/^([A-Za-z])([A-Za-z']*)/,(m,a,b)=>a+"_".repeat(b.length))).join(" "); }
function helpRow(c,text,hintAct){
  const box=c.st.showAns?`<div class="hintans">${h(text)}</div>`:(c.st.showHint?`<div class="hintans frame">${h(frameOf(text))}</div>`:"");

  return `${tag}<div class="chat">${meFirst?"":`<div class="bubble a"><div class="en">${h(A.text)}</div>${koA(c,A)}</div>`}

function bindCard(c){
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const inp=document.getElementById("sayin");
    if(b.dataset.act==="mic"&&!speechOK){ window._typed=inp?inp.value:""; if(!window._typed.trim()){ inp&&inp.focus(); return; } }
    act(c,b.dataset.act); });
  const inp=document.getElementById("sayin");
  if(inp){ inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const btn=app.querySelector('[data-act="mic"]'); btn&&btn.click(); } }); }
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ c.st.picked.push(+b.dataset.p); checkOrder(c); });
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ c.st.picked.splice(+b.dataset.a,1); render(); });
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{ const t=talkById[c.id]; const k=+b.dataset.opt; c.st.chosen=k; const ok=c.opts[k]===t.lines[1].text; c.st.fb=ok?"good":"bad"; srs(S.talks,c.id,ok); ok?chime():buzz(); render(); autoNext(c,playLine(t,1),1000); });
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.pick; c.st.chosen=k; const ok=c.opts[k]===c.right; c.st.fb=ok?"good":"bad"; ok?chime():buzz(); render();
    if(c.kind==="tense"){ srs(S.items,c.id,ok); const z=TZ[c.id]; autoNext(c,new Promise(r=>setTimeout(r,300)).then(()=>playSrc(z.id,z.url,z.right)),ok?900:2600); return; }
    autoNext(c,new Promise(r=>setTimeout(r,300)).then(()=>playSrc("pick",null,c.right)),ok?700:1300); });
  app.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{ const it=byId[c.id]; const ans=it.q[c.st.yes?0:1]; const ok=c.opts[+b.dataset.ans]===ans; finishStep(c,ok); playSrc("ans",null,ans); });
  app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{ const e=TIPS[c.c].ex[+b.dataset.ex][1]; playSrc("tip",null,e.replace("→",". ")); });
  // automatic sound + automatic mic when a card opens
  if(!c.st.auto){ c.st.auto=true;
    const wantsMic = speechOK && ((c.type==="say"&&c.steps[c.st.step]==="speak") || (c.type==="talk"&&c.mode!=="choose"));
    const go=()=>setTimeout(()=>{ if(cur()===c&&view==="lesson"&&!c.st.fb&&!c.st.listening) act(c,"mic"); },350);
    if(c.type==="talk" && c.mode!=="sayA"){ const p=playLine(talkById[c.id],0); if(wantsMic) p.then(go); }
    else if(wantsMic) go();
  }
}
function autoNext(c,p,wait){ Promise.resolve(p).then(()=>setTimeout(()=>{ if(view==="lesson"&&cur()===c) act(c,"next"); },wait||700)); }
function timeOut(c){
  if(c.st.fb) return; if(curRec) curRec.stop(); c.st.listening=false; c.st.fb="timeout"; c.st.firstTry=false; buzz(); render();
  if(c.type==="say") autoNext(c,new Promise(r=>setTimeout(r,500)).then(()=>playItem(byId[c.id])),1300);
  else { const t=talkById[c.id]; srs(S.talks,c.id,false); autoNext(c,new Promise(r=>setTimeout(r,500)).then(()=>playLine(t,0)).then(()=>playLine(t,1)),1300); }
}

  if(view!=="lesson"||!L) return; const ck=document.getElementById("clock"); if(ck) ck.textContent="⏱ "+mmss(elapsed());
  const c=cur(); if(!c||!c.st||!c.st.t0||c.st.fb) return;

  if(tb){ tb.firstChild.style.width=Math.max(0,Math.min(100,f*100))+"%"; tb.classList.toggle("late",f>.7); }

},100);
function markWrong(c){ if(c.type==="say"){ c.st.firstTry=false; } }
function finishStep(c,ok){
  c.st.fb= ok?"good":"giveup"; if(!ok) markWrong(c);
  ok?chime():buzz(); render();
}
async function act(c,a){
  if(c.type==="tip" && a==="next"){ S.tips[c.c]=true; save(); return advance(); }
  if(c.type==="say"){
    const it=byId[c.id], step=c.steps[c.st.step];
    if(a==="play") return playItem(it);
    if(a==="playq") return playSrc("q",null,it.text);
    if(a==="hintTxt"){ c.st.showHint=true; return render(); }
    if(a==="skip"){ c.st.firstTry=false; return act(c,"next"); }
    if(a==="hint"){ c.st.firstTry=false; c.st.showAns=true; render(); return playItem(it); }
    if(a==="selfsaid"){ c.st.fb="good"; render(); autoNext(c,playItem(it)); return; }
    if(a==="mic"){ if(c.st.listening||c.st.fb) return; if(!c.st.t0) c.st.t0=Date.now()+300; c.st.listening=true; render();
      const r=await listenOnce();
      if(cur()!==c||c.st.fb==="timeout"||view!=="lesson") return; c.st.listening=false;
      if((r.err&&!speechOK)||micBusy){ render(); return; }
      const target= step==="answer" ? it.q[c.st.yes?0:1] : (it.match||it.text);
      c.st.heard=(r.alts&&r.alts[0])||"(잘 안 들렸어요)";
      const targets= step==="answer" ? [target].concat(it.qfull?[it.qfull[c.st.yes?0:1],(c.st.yes?"Yes, ":"No, ")+it.qfull[c.st.yes?0:1]]:[]) : [target];
      const okSay=!!(r.alts&&targets.some(tg=>matches(tg,r.alts,it.week===6))); if(r.alts&&r.alts.length) logHeard(it.text,r.alts,okSay);
      if(okSay){ c.st.fb="good"; chime(); render(); autoNext(c,new Promise(r=>setTimeout(r,350)).then(()=>playItem(it))); return; }
      if(r.alts&&r.alts.length){ c.st.tries++; buzz(); }
      render();
      if(speechOK&&!r.aborted) setTimeout(()=>{ if(cur()===c&&!c.st.fb&&!c.st.listening&&(c.st.relis=(c.st.relis||0)+1)<=3) act(c,"mic"); },700);
      return;
    }
    if(a==="next"){
      if(c.st.step<c.steps.length-1){ c.st.step++; c.st.fb=null; c.st.tries=0; c.st.heard=""; c.st.auto=false; render(); return; }
      // card done: record once
      if(!L.wrong.has(c.id)&&!L.done.has(c.id)) srs(S.items,c.id,c.st.firstTry); L.done.add(c.id);
      if(!c.st.firstTry){ L.wrong.add(c.id); if(!L.retried.has(c.id)){ L.retried.add(c.id); L.queue.push({type:"say",id:c.id,fresh:false}); L.total=L.queue.length; } }
      return advance();
    }
  }
  if(c.type==="talk"){
    const t=talkById[c.id];
    if(a==="playA") return playLine(t,0);
    if(a==="replay"){ await playLine(t,0); return playLine(t,1); }
    if(a==="hintTxt"){ c.st.showHint=true; return render(); }
    if(a==="skip"){ if(!c.st.fb) srs(S.talks,c.id,false); return advance(); }
    if(a==="showKo"){ c.st.showKo=true; return render(); }
    if(a==="hintTalk"){ c.st.firstTry=false; c.st.showAns=true; render(); return playLine(t,c.mode==="sayB"?1:0); }
    if(a==="selfsaid"||a==="mic"){
      const mine=c.mode==="sayB"?1:0;
      let ok=true;
      if(a==="mic"){ if(c.st.listening||c.st.fb) return; if(!c.st.t0) c.st.t0=Date.now()+300; c.st.listening=true; render(); const r=await listenOnce();
        if(cur()!==c||c.st.fb==="timeout"||view!=="lesson") return; c.st.listening=false;
        if((r.err&&!speechOK)||micBusy){ render(); return; }
        c.st.heard=(r.alts&&r.alts[0])||"(잘 안 들렸어요)"; ok=!!(r.alts&&matches(t.lines[mine].match||t.lines[mine].text,r.alts,true)); if(r.alts&&r.alts.length) logHeard(t.lines[mine].text,r.alts,ok);
        if(!ok){ if(r.alts&&r.alts.length){ c.st.tries++; buzz(); } render();
          if(speechOK&&!r.aborted) setTimeout(()=>{ if(cur()===c&&!c.st.fb&&!c.st.listening&&(c.st.relis=(c.st.relis||0)+1)<=3) act(c,"mic"); },700);
          return; } }
      c.st.fb= ok?"good":"giveup"; srs(S.talks,c.id,ok&&c.st.firstTry); ok?chime():null; render();
      const p = c.mode==="sayA" ? playLine(t,0).then(()=>playLine(t,1)) : playLine(t,1);
      autoNext(c,p); return;
    }
    if(a==="next") return advance();
  }
  if(c.type==="pick" && a==="next") return advance();
}
function checkOrder(c){
  if(c.st.picked.length<c.target.length){ render(); return; }
  const said=c.st.picked.map(k=>c.pool[k].w);
  const ok=said.join(" ")===c.target.join(" ");
  if(!ok){
    markWrong(c);
    const tq=c.target[c.target.length-1]==="?", sq=said[said.length-1]==="?";
    const sameWords=[...said].sort().join()===[...c.target].sort().join();
    if(tq && sq && sameWords) c.st.why="물어볼 때는 is, are를 맨 앞으로! 🔄";
    else if(tq && !sq) c.st.why="물어보는 말이니까 끝에 ? 를 붙여요";
    else if(!tq && sq) c.st.why="물어보는 말이 아니라서 . 을 붙여요";
    else if(said.some(w=>/^(he|she)$/i.test(w)) && c.target.some(w=>/^(he|she)$/i.test(w)) && !said.join(" ").toLowerCase().includes(c.target.find(w=>/^(he|she)$/i.test(w)).toLowerCase())) c.st.why="남자는 he, 여자는 she!";
    else if(said.some(w=>/^(this|that)$/i.test(w)) && !said.map(w=>w.toLowerCase()).includes(c.target[0].toLowerCase())) c.st.why="가까우면 this, 멀면 that!";
  }
  c.st.fb= ok?"good":"bad"; ok?chime():buzz(); render(); playItem(byId[c.id]);
}
function advance(){
  stopAll(); L.i++; if(L.i<L.queue.length) saveSession();
  if(L.i>=L.queue.length) return finishLesson();
  enterCard(); render();
}
function finishLesson(){
  const today=todayStr(), owned=new Set(S.stickers), choices=STICKERS.filter(s=>!owned.has(s));
  const opts=shuffle(choices.length>=3?choices:STICKERS).slice(0,3), pick=opts[0]; L.stkOpts=opts;
  const wk=curWeek(); S.nextWeek = wk>=S.bookWeek ? 1 : wk+1; S.session=null; S.weekPass=S.weekPass||{}; S.weekPass[wk]=(S.weekPass[wk]||0)+1;
  const secs=Math.round(elapsed()/1000);
  if(!S.days[today]){ S.days[today]={sticker:pick,n:L.total,wrong:L.wrong.size,week:wk,secs}; S.stickers.push(pick); }
  save(); view="finish"; render(); fanfare();
}
function confetti(){
  const box=document.createElement("div"); box.className="confetti"; const C=["#A98BE6","#F2A9C9","#FFCF6B","#8FD3C1","#6F9BE0","#FF9DB5"];
  for(let i=0;i<70;i++){ const p=document.createElement("i"); p.style.left=Math.random()*100+"%"; p.style.background=C[i%C.length];
    p.style.animationDelay=(Math.random()*1.2)+"s"; p.style.animationDuration=(2.4+Math.random()*1.8)+"s"; p.style.width=p.style.height=(8+Math.random()*8)+"px"; if(i%3===0) p.style.borderRadius="50%"; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5000);
}
function fanfare(){ try{ const C=window.AudioContext||window.webkitAudioContext; const c=chime.c||(chime.c=new C()); if(c.state==="suspended") c.resume();
  [[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64]].forEach(([f,d])=>{ const o=c.createOscillator(),g=c.createGain(); o.type="triangle"; o.frequency.value=f; const t=c.currentTime+d;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+(d>.6?.6:.22)); o.connect(g).connect(c.destination); o.start(t); o.stop(t+.7); }); }catch(e){} }

function openGate(){ gate={mode:S.pin?"enter":"new",input:"",first:null,err:""}; view="gate"; render(); }
function renderGate(){
  const title= gate.mode==="enter"?"비밀번호를 눌러 주세요":gate.mode==="new"?"아빠 화면 비밀번호를 새로 정해요 (숫자 4자리)":"한 번 더 눌러 주세요";
  app.innerHTML=`<div class="gate"><div class="q">${title}</div><div class="dots4">${[0,1,2,3].map(i=>`<i class="${i<gate.input.length?"f":""}"></i>`).join("")}</div><div class="err">${gate.err}</div>
   <div class="keys">${[1,2,3,4,5,6,7,8,9,"←",0,"취소"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div></div>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==="취소"){ view="home"; render(); return; }
    if(k==="←"){ gate.input=gate.input.slice(0,-1); render(); return; }
    gate.input+=k; gate.err="";
    if(gate.input.length===4){
      if(gate.mode==="enter"){ if(gate.input===S.pin){ view="parent"; } else { gate.err="비밀번호가 달라요"; gate.input=""; } }
      else if(gate.mode==="new"){ gate.first=gate.input; gate.input=""; gate.mode="confirm"; }
      else { if(gate.input===gate.first){ S.pin=gate.input; save(); view="parent"; } else { gate.err="두 번이 달라요. 다시 정해요"; gate.mode="new"; gate.input=""; } }
    }
    render();
  });
}
function weekTable(){
  const ws=[...new Set(ITEMS.map(i=>i.week))].sort((a,b)=>a-b);
  const rows=ws.map(w=>{ const q=buildQueue(w); const nb=q.filter(c=>c.type==="say"&&byId[c.id].src==="book").length, nd=q.filter(c=>c.type==="say"&&byId[c.id].src==="drill").length, np=q.filter(c=>c.type==="pick").length, nt=q.filter(c=>c.type==="talk").length;
    return `<tr class="${w===curWeek()?"cur":""}"><td>${w}주차${w>S.bookWeek?" (아직)":""}</td><td>${nb}</td><td>${nd}</td><td>${np}</td><td>${nt}</td><td><b>${q.length}</b></td></tr>`; }).join("");
  return `<div style="overflow-x:auto"><table class="wtable"><tr><th>주차</th><th>책</th><th>바꿔 말하기</th><th>누구일까</th><th>대화</th><th>합계</th></tr>${rows}</table></div>`;
}
function renderParent(){
  const today=todayStr();
  const avail=ITEMS.filter(unlocked);
  const cnt=src=>{ const c={know:0,learn:0,weak:0,new:0}; avail.filter(i=>i.src===src).forEach(i=>c[status(S.items[i.id])]++); return c; };
  const cb=cnt("book"), cx=cnt("drill"); const tb=avail.filter(i=>i.src==="book").length, tx=avail.filter(i=>i.src==="drill").length;
  const dday=diffDays(today,S.depart), days7=[...Array(7)].map((_,k)=>addDays(today,-k)).filter(d=>S.days[d]).length;
  const [y,m,d]=today.split("-").map(Number), dow=new Date(y,m-1,d).getDay(), start=addDays(today,-dow-21);
  const cells=["일","월","화","수","목","금","토"].map(x=>`<div class="dow">${x}</div>`);
  for(let k=0;k<28;k++){ const dd=addDays(start,k); cells.push(`<div class="${S.days[dd]?"on":""} ${dd===today?"today":""}">${S.days[dd]?S.days[dd].sticker:+dd.slice(8)}</div>`); }
  const weak=ITEMS.filter(i=>S.items[i.id]&&S.items[i.id].wrong>0).sort((a,b)=>S.items[b.id].recentWrong-S.items[a.id].recentWrong||S.items[b.id].wrong-S.items[a.id].wrong).slice(0,8);
  const hsWrong=ITEMS.filter(i=>(i.who===HE||i.who===SHE)&&S.items[i.id]).reduce((a,i)=>a+S.items[i.id].wrong,0);
  const label={know:["아는 문장","p-know"],learn:["익히는 중","p-learn"],weak:["헷갈림","p-weak"],new:["아직","p-new"]};
  const row=i=>{ const s=S.items[i.id], k=status(s); return `<div class="row"><span style="font-size:26px">${i.who||""}${i.emoji}</span>
    <div class="t">${h(i.text)}<small>${h(i.ko)} · ${i.src==="drill"?"바꿔 말하기":"책"} ${i.week}주차${s?` · 틀림 ${s.wrong}번 · 다음 복습 ${s.due<=today?"오늘":s.due.slice(5).replace("-","/")}`:""}</small></div>
    <span class="pill ${label[k][1]}">${label[k][0]}</span><button class="mini" data-play="${i.id}" aria-label="듣기">🔊</button></div>`; };
  const bar=(c,t)=>`<div class="bar"><i style="width:${c.know/t*100}%;background:var(--pine)"></i><i style="width:${c.learn/t*100}%;background:var(--sun)"></i><i style="width:${c.weak/t*100}%;background:var(--maple)"></i></div>
    <div class="legend"><span style="--c:var(--pine)">아는 문장 ${c.know}</span><span style="--c:var(--sun)">익히는 중 ${c.learn}</span><span style="--c:var(--maple)">헷갈림 ${c.weak}</span><span style="--c:var(--line)">아직 ${c.new}</span></div>`;
  app.innerHTML=`<div class="parent"><div class="ptop"><h2>아빠 화면</h2><button class="back" id="back">← 아이 화면</button></div>
  <div class="stats">
    <div class="stat dday"><div class="lab">캐나다 캠프까지</div><div class="num">D-${dday}</div></div>
    <div class="stat"><div class="lab">최근 7일 중 학습</div><div class="num">${days7}<small>/7일</small></div></div>
    <div class="stat"><div class="lab">연속 학습</div><div class="num">${streak()}<small>일</small></div></div>
    <div class="stat"><div class="lab">he/she 문장 틀린 횟수</div><div class="num">${hsWrong}<small>번</small></div></div>
  </div>
  <div class="panel"><h3>주차별 문제 수</h3>${weekTable()}<div class="note">말하기 = 책 문장 + 바꿔 말하기. 틀린 문장 복습(최대 ${S.reviewCap}개)과 다시 나오는 문장은 빼고 센 숫자예요.</div></div>
  <div class="panel"><h3>책 문장 (${S.bookWeek}주차까지 ${tb}개)</h3>${bar(cb,tb)}</div>
  <div class="panel"><h3>바꿔 말하기 문장 (${tx}개: 의문문, 부정문, he/she)</h3>${bar(cx,tx)}<div class="note">한 번도 안 틀리고 세 번 넘게 맞히면 "아는 문장"이 돼요.</div></div>
  <div class="panel"><h3>자주 틀리는 문장 <span class="note">저녁에 이것만 한두 개 같이 말해 보세요</span></h3><div class="list">${weak.length?weak.map(row).join(""):`<div class="note">아직 틀린 문장이 없어요.</div>`}</div></div>
  <div class="panel"><details><summary>앱이 들은 말 (최근 ${Math.min(30,(S.heardLog||[]).length)}개)</summary><div class="note">❌는 틀렸다고 나온 것. 서현이가 맞게 말했는데 ❌라면 이 화면을 찍어서 보내 주세요.</div><div class="list">${(S.heardLog||[]).slice(0,30).map(x=>`<div class="row" style="grid-template-columns:auto 1fr"><span>${x.ok?"⭕":"❌"}</span><div class="t">${h(x.t)}<small>들은 말: ${h(x.h)} · ${x.d.slice(5)}</small></div></div>`).join("")||`<div class="note">아직 없어요.</div>`}</div></details></div>
  ${PHONE.length?`<div class="panel"><h3>📞 전화영어 (수업 문장 ${PBASE.length}개 · 바꿔 말하기 포함 ${PHONE.length}개)</h3><div class="note">매일 미션 맨 앞에 수업 문장과 그 패턴 연습이 ${PHONE_SAY}개 정도, 선생님 질문 ${PHONE_TALK}개, 어제/매일 고르기 ${TENSE_N}개가 나와요. 각 문장은 ① 뒤 단어 바꾸기 → ② 앞 사람 바꾸기 → ③ 질문하고 대답하기 순서로, 앞 단계 문장을 다 맞히면 다음 단계가 열려요.</div><div class="list">${PBASE.map(i=>{ const s=S.items[i.id], k=status(s), st=openStage(i), stl=["","① 뒤 단어 바꾸기","② 앞 사람 바꾸기","③ 질문·대답"][st]; return `<div class="row" style="grid-template-columns:1fr auto auto"><div class="t">${h(i.text)}<small>${h(i.ko)} · ${i.lesson.slice(5).replace("-","/")} 수업 · 지금 ${stl}${s?` · 틀림 ${s.wrong}번`:""}</small></div><span class="pill ${label[k][1]}">${label[k][0]}</span><button class="mini" data-play="${i.id}" aria-label="듣기">🔊</button></div>`; }).join("")}${PTALKS.filter(t=>!t.base).map(t=>{ const s=S.talks[t.id], k=status(s); return `<div class="row" style="grid-template-columns:1fr auto"><div class="t">${h(t.lines[0].text)} → ${h(t.lines[1].text)}<small>선생님 질문 · ${t.lines[1].ko}</small></div><span class="pill ${label[k][1]}">${label[k][0]}</span></div>`; }).join("")}</div></div>`:""}
  <div class="panel"><h3>최근 4주</h3><div class="cal">${cells.join("")}</div></div>
  <div class="panel"><details><summary>전체 문장 보기 (${avail.length}개)</summary><div class="list">${avail.map(row).join("")}</div></details></div>
  <div class="panel"><h3>설정</h3>
    <div class="field"><label for="bw">책 진도</label><select id="bw">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===S.bookWeek?"selected":""}>${n}주차까지</option>`).join("")}</select></div>
    <div class="field"><label for="nb">오늘(다음) 할 주차</label><select id="nb">${Array.from({length:S.bookWeek},(_,k)=>k+1).map(n=>`<option value="${n}" ${n===curWeek()?"selected":""}>${n}주차</option>`).join("")}</select>
      <label for="nx">누구일까</label><select id="nx">${[0,1,2,3,4,5].map(n=>`<option ${n===(S.whoCount??3)?"selected":""}>${n}</option>`).join("")}</select>
      <label for="rc">복습 최대</label><select id="rc">${[4,6,8,10,12].map(n=>`<option ${n===S.reviewCap?"selected":""}>${n}</option>`).join("")}</select></div>
    <div class="field"><label for="dep">출발일</label><input type="date" id="dep" value="${S.depart}"></div>
    <div class="note">음성인식: ${speechOK?"켜짐 (아이가 말하면 앱이 듣고 확인해요)":"이 화면에서는 키보드 음성 입력(🎤)으로 말한 걸 글자로 받아서 확인해요. 키보드 음성 입력 언어를 영어로 해 두세요."}</div>
    <h3>테스트용</h3>
    <div class="note">지금 보는 날짜: ${today}${S.offset?` (실제보다 ${S.offset}일 뒤)`:""}</div>
    <div class="tools"><button class="tbtn" id="skip">하루 넘기기 →</button>${S.offset?`<button class="tbtn" id="real">오늘로 돌아오기</button>`:""}${doneToday()?"":`<button class="tbtn" id="markdone">오늘 미션 완료로 표시</button>`}${confirmToday?`<button class="tbtn warn" id="today0">정말 오늘 공부를 지울까요?</button><button class="tbtn" id="today0no">취소</button>`:`<button class="tbtn" id="today0ask">오늘 공부 처음부터</button>`}<button class="tbtn" id="pinchg">비밀번호 바꾸기</button>
      ${confirmReset?`<button class="tbtn warn" id="reset2">정말 지울까요? 기록이 모두 지워져요</button><button class="tbtn" id="nores">취소</button>`:`<button class="tbtn warn" id="reset">기록 모두 지우기</button>`}</div>
    <div class="note">${syncState}</div></div></div>`;
  const $=id=>document.getElementById(id);
  $("back").onclick=()=>{view="home";confirmReset=false;render();};
  app.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>playItem(byId[b.dataset.play]));
  app.querySelectorAll("[data-tip]").forEach(b=>b.onclick=()=>{ delete S.tips[b.dataset.tip]; save(); render(); });
  $("bw").onchange=e=>{S.bookWeek=+e.target.value;save();render();};
  $("nb").onchange=e=>{S.nextWeek=+e.target.value;S.session=null;save();};
  $("nx").onchange=e=>{S.whoCount=+e.target.value;save();};
  $("rc").onchange=e=>{S.reviewCap=+e.target.value;save();};
  $("dep").onchange=e=>{ if(e.target.value){S.depart=e.target.value;save();render();} };
  $("skip").onclick=()=>{S.offset++;save();render();};
  if($("markdone")) $("markdone").onclick=()=>{ const today=todayStr(), wk=curWeek(), owned=new Set(S.stickers), ch=STICKERS.filter(x=>!owned.has(x)), pk=pickOne(ch.length?ch:STICKERS);
    S.days[today]={sticker:pk,n:0,wrong:0,week:wk,secs:0}; S.stickers.push(pk); S.weekPass=S.weekPass||{}; S.weekPass[wk]=(S.weekPass[wk]||0)+1; S.nextWeek=wk>=S.bookWeek?1:wk+1; S.session=null; save(); render(); };
  if($("today0ask")) $("today0ask").onclick=()=>{ confirmToday=true; render(); };
  if($("today0no")) $("today0no").onclick=()=>{ confirmToday=false; render(); };
  if($("today0")) $("today0").onclick=()=>{ confirmToday=false; const today=todayStr(), sn=S.daySnap; // undo everything done today: answers, timer, sticker
    if(sn&&sn.date===today){ S.items=sn.items; S.talks=sn.talks; S.weekPass=sn.weekPass; S.nextWeek=sn.nextWeek; }
    if(S.days[today]){ const k=S.stickers.lastIndexOf(S.days[today].sticker); if(k>=0) S.stickers.splice(k,1); delete S.days[today]; }
    S.heardLog=(S.heardLog||[]).filter(x=>x.d!==today); S.session=null; S.daySnap=null; save(); view="home"; render(); };
  if($("real")) $("real").onclick=()=>{S.offset=0;save();render();};
  $("pinchg").onclick=()=>{ gate={mode:"new",input:"",first:null,err:""}; view="gate"; render(); };
  if($("reset")) $("reset").onclick=()=>{confirmReset=true;render();};
  if($("reset2")) $("reset2").onclick=()=>{ const keep={depart:S.depart,bookWeek:S.bookWeek,newBook:S.newBook,whoCount:S.whoCount,reviewCap:S.reviewCap,pin:S.pin}; S=Object.assign(blank(),keep); confirmReset=false; save(); render(); };
  if($("nores")) $("nores").onclick=()=>{confirmReset=false;render();};
}
render();
window._dbg={matches,buildQueue,finishLesson,get S(){return S},get L(){return L},render:()=>render(),save:()=>save(),setView:v=>{view=v;render();},get view(){return view}};
}
</script>
